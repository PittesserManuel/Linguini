name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruefen:
    name: Typen, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Typen pruefen
        run: npx tsc --noEmit

      - name: Tests der Korrektur-Engine
        run: npm test

      - name: Build
        run: npm run build
